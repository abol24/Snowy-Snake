<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Snowy Snake ❄️</title>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: linear-gradient(180deg, #0a1628 0%, #1a2a4a 50%, #0d1b2a 100%);
      color: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      touch-action: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Background snowflakes */
    .snowflake {
      position: absolute;
      color: white;
      font-size: 1rem;
      opacity: 0.6;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 10px 6px;
      overflow: hidden;
    }

    h1 {
      font-size: 1.35rem;
      margin-bottom: 2px;
      background: linear-gradient(90deg, #7dd3fc, #e0f2fe, #bae6fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      flex-shrink: 0;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .score-board {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .score-item {
      background: rgba(30, 60, 100, 0.6);
      padding: 5px 12px;
      border-radius: 10px;
      border: 1px solid rgba(125, 211, 252, 0.3);
    }

    .score-item span {
      color: #7dd3fc;
      font-weight: 700;
    }

    .game-wrapper {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      background: linear-gradient(180deg, #0c1a2e 0%, #152238 100%);
      border-radius: 10px;
      border: 2px solid rgba(125, 211, 252, 0.4);
      box-shadow: 0 0 20px rgba(100, 180, 255, 0.2),
                  inset 0 0 40px rgba(0, 0, 0, 0.4);
      display: block;
      touch-action: none;
      width: min(100%, 360px);
      height: auto;
      aspect-ratio: 1 / 1;
      max-height: 100%;
    }

    /* Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100%, 360px);
      height: 100%;
      background: rgba(10, 20, 40, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      z-index: 20;
      transition: opacity 0.25s;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #7dd3fc;
    }

    .overlay p {
      font-size: 0.95rem;
      margin-bottom: 14px;
      color: #cbd5e1;
    }

    .final-score {
      font-size: 1.15rem;
      color: #fde047;
      margin-bottom: 14px;
    }

    button {
      font-family: 'Nunito', system-ui, sans-serif;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 0.95rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 3px 12px rgba(14, 165, 233, 0.4);
      font-weight: 700;
      -webkit-user-select: none;
      user-select: none;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: linear-gradient(135deg, #475569, #334155);
      box-shadow: 0 3px 10px rgba(71, 85, 105, 0.4);
      padding: 8px 18px;
      font-size: 0.85rem;
    }

    /* Bottom controls area – always visible, no scroll */
    .bottom-area {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 6px;
      gap: 6px;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* Mobile D-pad – always visible on small screens */
    .mobile-controls {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 2px 0 4px;
    }

    .dpad {
      display: grid;
      grid-template-columns: 62px 62px 62px;
      grid-template-rows: 52px 52px;
      gap: 5px;
      justify-items: center;
      align-items: center;
    }

    .mobile-btn {
      width: 58px;
      height: 50px;
      font-size: 1.4rem;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: linear-gradient(145deg, #0ea5e9, #0369a1);
      box-shadow: 0 3px 10px rgba(14, 165, 233, 0.4),
                  inset 0 1px 0 rgba(255,255,255,0.2);
      border: 1px solid rgba(125, 211, 252, 0.35);
      color: white;
      font-weight: 800;
      transition: transform 0.08s, background 0.1s;
      touch-action: manipulation;
    }

    .mobile-btn:active,
    .mobile-btn.pressed {
      transform: scale(0.9);
      background: linear-gradient(145deg, #38bdf8, #0ea5e9);
    }

    .mobile-btn.up    { grid-column: 2; grid-row: 1; }
    .mobile-btn.left  { grid-column: 1; grid-row: 2; }
    .mobile-btn.down  { grid-column: 2; grid-row: 2; }
    .mobile-btn.right { grid-column: 3; grid-row: 2; }

    .instructions {
      font-size: 0.72rem;
      color: #64748b;
      line-height: 1.4;
      text-align: center;
      display: none;
    }

    .instructions kbd {
      background: rgba(30, 60, 100, 0.8);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(125, 211, 252, 0.25);
      font-family: monospace;
      color: #7dd3fc;
      font-size: 0.8em;
    }

    /* Desktop: show keyboard hint, hide d-pad if large screen */
    @media (min-width: 500px) and (min-height: 700px) {
      .instructions { display: block; }
      h1 { font-size: 1.7rem; }
      .subtitle { font-size: 0.9rem; }
    }

    /* Very short screens (Telegram often has limited height) */
    @media (max-height: 620px) {
      h1 { font-size: 1.15rem; margin-bottom: 0; }
      .subtitle { display: none; }
      .score-board { margin-bottom: 4px; font-size: 0.82rem; }
      .score-item { padding: 4px 10px; }
      .dpad {
        grid-template-columns: 54px 54px 54px;
        grid-template-rows: 46px 46px;
        gap: 4px;
      }
      .mobile-btn {
        width: 52px;
        height: 44px;
        font-size: 1.25rem;
        border-radius: 12px;
      }
      .bottom-area { padding-top: 4px; gap: 4px; }
      button { padding: 8px 18px; font-size: 0.88rem; }
    }

    @media (max-height: 540px) {
      h1 { font-size: 1.05rem; }
      .score-board { margin-bottom: 3px; }
      .dpad {
        grid-template-columns: 48px 48px 48px;
        grid-template-rows: 42px 42px;
        gap: 3px;
      }
      .mobile-btn {
        width: 46px;
        height: 40px;
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div id="snow-container"></div>

  <div class="container">
    <h1>❄️ Snowy Snake ❄️</h1>
    <p class="subtitle">Eat the glowing snowflakes!</p>

    <div class="score-board">
      <div class="score-item">Score: <span id="score">0</span></div>
      <div class="score-item">Best: <span id="highScore">0</span></div>
    </div>

    <div class="game-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div id="startScreen" class="overlay">
        <h2>Ready?</h2>
        <p>Use the buttons below to move</p>
        <button id="startBtn">Start Game 🎮</button>
      </div>

      <div id="gameOverScreen" class="overlay hidden">
        <h2>Game Over! 💥</h2>
        <p class="final-score">Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">Play Again 🔄</button>
      </div>
    </div>

    <div class="bottom-area">
      <div class="controls">
        <button id="pauseBtn" class="btn-secondary" disabled>Pause</button>
      </div>

      <!-- Always visible D-pad for mobile / Telegram -->
      <div class="mobile-controls">
        <div class="dpad">
          <button class="mobile-btn up" data-dir="up" type="button">↑</button>
          <button class="mobile-btn left" data-dir="left" type="button">←</button>
          <button class="mobile-btn down" data-dir="down" type="button">↓</button>
          <button class="mobile-btn right" data-dir="right" type="button">→</button>
        </div>
      </div>

      <div class="instructions">
        <p>
          <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or
          <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Telegram WebApp expand + theme
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      try { tg.disableVerticalSwipes(); } catch(e) {}
      document.body.style.background = tg.themeParams.bg_color || '';
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = {};
    let direction = { x: 0, y: 0 };
    let nextDirection = { x: 0, y: 0 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snowySnakeHighScore') || '0', 10);
    let gameRunning = false;
    let gameLoop = null;
    let speed = 130;
    let isPaused = false;
    let lastDirChange = 0;

    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const AdController = window.Adsgram.init({
        blockId: "49134"
    });
    console.log("AdsGram Controller:", AdController);

    highScoreEl.textContent = highScore;

    // Background snow
    function createSnowflakes() {
      const container = document.getElementById('snow-container');
      const symbols = ['❄', '❅', '❆', '•'];
      for (let i = 0; i < 28; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDuration = (Math.random() * 8 + 6) + 's';
        flake.style.animationDelay = (Math.random() * 10) + 's';
        flake.style.fontSize = (Math.random() * 10 + 7) + 'px';
        flake.style.opacity = Math.random() * 0.5 + 0.25;
        container.appendChild(flake);
      }
    }
    createSnowflakes();

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      speed = 130;
      scoreEl.textContent = score;
      placeFood();
      gameRunning = true;
      isPaused = false;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      pauseBtn.disabled = false;
      pauseBtn.textContent = 'Pause';

      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
    }

    function placeFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(s => s.x === newFood.x && s.y === newFood.y));
      food = newFood;
    }

    function update() {
      if (!gameRunning || isPaused) return;

      direction = { ...nextDirection };

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
      }

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snowySnakeHighScore', highScore);
        }
        placeFood();

        if (score % 50 === 0 && speed > 65) {
          speed -= 8;
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#0c1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = 'rgba(100, 150, 200, 0.07)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Food glow
      const foodX = food.x * gridSize + gridSize / 2;
      const foodY = food.y * gridSize + gridSize / 2;

      const gradient = ctx.createRadialGradient(foodX, foodY, 2, foodX, foodY, 14);
      gradient.addColorStop(0, 'rgba(253, 224, 71, 0.9)');
      gradient.addColorStop(0.5, 'rgba(250, 204, 21, 0.35)');
      gradient.addColorStop(1, 'rgba(250, 204, 21, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(foodX, foodY, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.arc(foodX, foodY, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI) / 3;
        ctx.beginPath();
        ctx.moveTo(foodX, foodY);
        ctx.lineTo(foodX + Math.cos(angle) * 9, foodY + Math.sin(angle) * 9);
        ctx.stroke();
      }

      // Snake
      snake.forEach((segment, index) => {
        const x = segment.x * gridSize;
        const y = segment.y * gridSize;

        if (index === 0) {
          const headGrad = ctx.createRadialGradient(
            x + gridSize/2, y + gridSize/2, 2,
            x + gridSize/2, y + gridSize/2, 12
          );
          headGrad.addColorStop(0, '#e0f2fe');
          headGrad.addColorStop(1, '#7dd3fc');
          ctx.fillStyle = headGrad;
        } else {
          const alpha = 1 - (index / snake.length) * 0.4;
          ctx.fillStyle = `rgba(186, 230, 253, ${alpha})`;
        }

        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(x + 1, y + 1, gridSize - 2, gridSize - 2, 6);
        } else {
          ctx.rect(x + 1, y + 1, gridSize - 2, gridSize - 2);
        }
        ctx.fill();

        if (index === 0) {
          ctx.fillStyle = '#0c4a6e';
          if (direction.x === 1) {
            ctx.beginPath();
            ctx.arc(x + gridSize - 6, y + 6, 2.5, 0, Math.PI * 2);
            ctx.arc(x + gridSize - 6, y + gridSize - 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
          } else if (direction.x === -1) {
            ctx.beginPath();
            ctx.arc(x + 6, y + 6, 2.5, 0, Math.PI * 2);
            ctx.arc(x + 6, y + gridSize - 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
          } else if (direction.y === -1) {
            ctx.beginPath();
            ctx.arc(x + 6, y + 6, 2.5, 0, Math.PI * 2);
            ctx.arc(x + gridSize - 6, y + 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(x + 6, y + gridSize - 6, 2.5, 0, Math.PI * 2);
            ctx.arc(x + gridSize - 6, y + gridSize - 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });
    }

    function endGame() {
      gameRunning = false;
      clearInterval(gameLoop);
      finalScoreEl.textContent = score;
      gameOverScreen.classList.remove('hidden');
      pauseBtn.disabled = true;
    }

    // Direction change with debounce to prevent stuck / double-tap issues
    function setDirection(dir) {
      if (!gameRunning || isPaused) return;
      const now = Date.now();
      if (now - lastDirChange < 40) return; // prevent rapid spam
      lastDirChange = now;

      if (dir === 'up'    && direction.y === 0) nextDirection = { x: 0, y: -1 };
      if (dir === 'down'  && direction.y === 0) nextDirection = { x: 0, y: 1 };
      if (dir === 'left'  && direction.x === 0) nextDirection = { x: -1, y: 0 };
      if (dir === 'right' && direction.x === 0) nextDirection = { x: 1, y: 0 };
    }

    // Keyboard
    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === 'ArrowUp' || key === 'w' || key === 'W') setDirection('up');
      else if (key === 'ArrowDown' || key === 's' || key === 'S') setDirection('down');
      else if (key === 'ArrowLeft' || key === 'a' || key === 'A') setDirection('left');
      else if (key === 'ArrowRight' || key === 'd' || key === 'D') setDirection('right');
      else if (key === ' ' && !gameRunning) startGameWithAd();
      e.preventDefault();
    });

    // Mobile / touch buttons – reliable for Telegram
    document.querySelectorAll('.mobile-btn').forEach(btn => {
      const dir = btn.dataset.dir;

      const press = (e) => {
        e.preventDefault();
        e.stopPropagation();
        btn.classList.add('pressed');
        setDirection(dir);
      };
      const release = (e) => {
        e.preventDefault();
        btn.classList.remove('pressed');
      };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    });

    // Prevent page scroll / bounce on the whole document
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    function startGameWithAd() {
        console.log("AD: Start requested");
    
        AdController.show()
            .then((result) => {
                console.log("AD RESULT:", result);
    
                if (result.done) {
                    console.log("AD: Completed");
                    initGame();
                }
            })
            .catch((error) => {
                console.error("AD ERROR:", error);
            });
    }

    startBtn.addEventListener('click', startGameWithAd);
    restartBtn.addEventListener('click', startGameWithAd);

    pauseBtn.addEventListener('click', () => {
      if (!gameRunning) return;
      isPaused = !isPaused;
      if (isPaused) {
        clearInterval(gameLoop);
        pauseBtn.textContent = 'Resume';
      } else {
        gameLoop = setInterval(update, speed);
        pauseBtn.textContent = 'Pause';
      }
    });


// Initial draw
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];
    
    placeFood();
    draw();
  </script>
</body>
</html>
